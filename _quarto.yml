project:
  type: website
  output-dir: docs
  # Only the pages: keeps CLAUDE.md and README.md out of the site.
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Pulls the latest mathviz release into _extensions/ before every build.
  pre-render: scripts/update-mathviz.sh

website:
  title: "Monte Carlo Methods Lecture Notes"
  site-url: https://apurvanakade.github.io/Monte-Carlo-Methods
  open-graph: true
  page-navigation: true
  bread-crumbs: false
  navbar:
    search: true
    left:
      - text: Interactive Apps
        href: apps/index.qmd
    right:
      - icon: github
        href: https://github.com/apurvanakade/Monte-Carlo-Methods
        aria-label: GitHub
  # Hand-written. Every page is <slug>/index.qmd; the draft pages (mmn,
  # kalman-filters, optimization, simulated-annealing, cross-entropy) are
  # left out until they are ready.
  sidebar:
    style: floating
    contents:
      - text: Preface
        href: index.qmd
      - intro/index.qmd
      - section: Estimation
        href: estimation/index.qmd
        contents:
          - estimating-pi/index.qmd
          - integrals/index.qmd
      - section: Sampling
        href: sampling/index.qmd
        contents:
          - rng/index.qmd
          - discrete/index.qmd
          - inverse-transform/index.qmd
          - other-distributions/index.qmd
          - accept-reject/index.qmd
          - gibbs-2d/index.qmd
          - mh/index.qmd
      - variance-reduction/index.qmd
      - section: Applications
        contents:
          - sde/index.qmd
          - ising/index.qmd
          - bootstrap/index.qmd
      - section: Advanced Topics
        contents:
          - particle-filters/index.qmd
      - section: Appendices
        contents:
          - probability/index.qmd
          - markov-chains/index.qmd
      - apps/index.qmd
  page-footer: "© 2025 Apurva Nakade. All rights reserved."

bibliography: references.bib

# A comment thread under every page (https://giscus.app): each page's thread
# is a GitHub Discussion in this repo's "General" category, keyed by the
# page's path. The ids are from the repo's GraphQL API; giscus's GitHub app
# must be installed on the repo. A page opts out with `comments: false`.
comments:
  giscus:
    repo: apurvanakade/Monte-Carlo-Methods
    repo-id: R_kgDOPX0lZg
    category: General
    category-id: DIC_kwDOPX0lZs4DIeN8
    mapping: pathname
    reactions-enabled: true
    input-position: top

# mathviz (https://github.com/apurvanakade/mathviz): puts math.js, Plotly,
# window.VM and the mathviz stylesheet into every page's <head>.
filters:
  - mathviz
mathviz:
  referrer: same-origin
  # Pin/unpin the sidebar (state kept in localStorage under this key), and
  # a title search box at the top of it.
  sidebar-rail: mcm-sidebar-pinned
  sidebar-search: true
  # Inter + JetBrains Mono from site_libs/ (the theme below names them).
  fonts: true
  # Select text -> "Report bug" opens an issue linking the page's .qmd source.
  report-bug:
    repo: apurvanakade/Monte-Carlo-Methods
  # A "Share" button on every app (each <div class="vm-app">) with the page
  # link and an <iframe> snippet. Turns on embed mode too: any app page
  # loaded with ?embed=1 shows the app alone, for a frame.
  share:
    site-url: https://apurvanakade.github.io/Monte-Carlo-Methods

format:
  html:
    # The sidebar rail's layout assumes these widths.
    grid:
      body-width: 1000px
      sidebar-width: 260px
      margin-width: 200px
    # mathviz's Quarto theme: Bootstrap chrome in the same palette as the
    # mathviz panels. Site overrides go in a second file listed after each
    # (set $vm-* variables under /*-- scss:defaults --*/).
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss]
    css:
      - assets/style.css
    # No comment thread in mathviz embed mode (?embed=), which shows the app
    # alone. Drop this once mathviz's chrome/embed.css lists .giscus.
    include-in-header:
      text: "<style>html.vm-embed .giscus { display: none !important; }</style>"

# Every code cell is OJS, run in the reader's browser; nothing executes at
# render time.
execute:
  echo: false
  warning: false
