project:
  type: book
  output-dir: docs
  # Pulls the latest mathviz release into _extensions/ before every build.
  pre-render: scripts/update-mathviz.sh

book:
  title: "Monte Carlo Methods Lecture Notes"
  author: "Apurva Nakade"
  sidebar:
    style: docked
  navbar:
    search: true
    left:
      - text: Interactive Apps
        href: apps/index.qmd
    right:
      - icon: github
        href: https://github.com/apurvanakade/Monte-Carlo-Methods
        aria-label: GitHub
  open-graph: true
  chapters:
    - index.qmd
    - chapters/intro.qmd
    - part: chapters/estimation/index.qmd
      chapters:
        - chapters/estimation/estimating_pi.qmd
        - chapters/estimation/integrals.qmd
    - part: chapters/sampling/index.qmd
      chapters:
        - chapters/sampling/rng.qmd
        - chapters/sampling/discrete.qmd
        - chapters/sampling/inverse_transform.qmd
        - chapters/sampling/other_distributions.qmd
        - chapters/sampling/accept_reject.qmd
        - chapters/sampling/gibbs_2d.qmd
        - chapters/sampling/mh.qmd
    - chapters/variance_reduction.qmd
    - part: "Applications"
      chapters:
        - chapters/applications/SDE.qmd
        - chapters/applications/ising.qmd
        - chapters/applications/mmn.qmd
        - chapters/applications/bootstrap.qmd
    - part: "Advanced Topics"
      chapters:
        - chapters/dynamical/kalman_filters.qmd
        - chapters/dynamical/particle_filters.qmd
    - part: "Optimization"
      chapters:
        - chapters/optimization/index.qmd
        - chapters/optimization/simulated_annealing.qmd
        - chapters/optimization/cross_entropy.qmd
    - chapters/references.qmd
    # The apps live in the chapters (each a <div class="vm-app" id="...">);
    # apps/index.qmd links to each one's ?embed=<id> view.
    - part: "Interactive Apps"
      chapters:
        - apps/index.qmd
  appendices:
    - appendices/probability.qmd
    - appendices/markov_chains.qmd
  page-footer: "© 2025 Apurva Nakade. All rights reserved."

bibliography: references.bib

# mathviz (https://github.com/apurvanakade/mathviz): puts math.js, Plotly,
# window.VM and the mathviz stylesheet into every page's <head>.
filters:
  - mathviz
mathviz:
  referrer: same-origin
  # Inter + JetBrains Mono from site_libs/ (the theme below names them).
  fonts: true
  # Select text -> "Report bug" opens an issue linking the page's .qmd source.
  report-bug:
    repo: apurvanakade/Monte-Carlo-Methods
  # A "Share" button on every app (each <div class="vm-app">) with the page
  # link and an <iframe> snippet. Turns on embed mode too: any app page
  # loaded with ?embed=1 shows the app alone, for a frame.
  share:
    site-url: https://apurvanakade.github.io/Monte-Carlo-Methods

format:
  html:
    reader-mode: true
    # mathviz's Quarto theme: Bootstrap chrome in the same palette as the
    # mathviz panels. Site overrides go in a second file listed after each
    # (set $vm-* variables under /*-- scss:defaults --*/).
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss]
    css:
      - assets/style.css
    bread-crumbs: true
    back-to-top-navigation: true

# Every code cell is OJS, run in the reader's browser; nothing executes at
# render time.
execute:
  echo: false
  warning: false
