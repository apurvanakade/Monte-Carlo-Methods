project:
  type: website
  output-dir: docs
  # Only the pages: keeps CLAUDE.md and README.md out of the site.
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Pulls the latest mathviz release into _extensions/ before every build.
  pre-render: scripts/update-mathviz.sh

website:
  title: "Monte Carlo Methods Lecture Notes"
  site-url: https://apurvanakade.github.io/Monte-Carlo-Methods
  open-graph: true
  page-navigation: true
  bread-crumbs: false
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/apurvanakade/Monte-Carlo-Methods
        aria-label: GitHub
  # Hand-written. Every published page is chapters/<slug>/index.qmd; draft
  # pages live in drafts/<slug>/ and are left out until they are ready.
  sidebar:
    style: floating
    contents:
      - text: Preface
        href: index.qmd
      - chapters/monte-carlo/index.qmd
      - section: Estimation
        href: chapters/estimation-overview/index.qmd
        contents:
          - chapters/estimating-pi/index.qmd
          - chapters/estimating-integrals/index.qmd
      - section: Sampling
        href: chapters/sampling-overview/index.qmd
        contents:
          - chapters/random-numbers/index.qmd
          - chapters/discrete-distributions/index.qmd
          - chapters/inverse-transform/index.qmd
          - chapters/other-distributions/index.qmd
          - chapters/rejection-sampling/index.qmd
          - chapters/gibbs-sampling/index.qmd
          - chapters/metropolis-hastings/index.qmd
      - chapters/variance-reduction/index.qmd
      - section: Applications
        contents:
          - chapters/stochastic-equations/index.qmd
          - chapters/ising-model/index.qmd
          - chapters/bootstrap-method/index.qmd
      - section: Advanced Topics
        contents:
          - chapters/particle-filters/index.qmd
      - section: Appendices
        contents:
          - chapters/probability-review/index.qmd
          - chapters/markov-chains/index.qmd
  page-footer: "© 2026 Apurva Nakade"

bibliography: references.bib

# A comment thread under every page (https://giscus.app): each page's thread
# is a GitHub Discussion in this repo's "General" category, keyed by the
# page's path. The ids are from the repo's GraphQL API; giscus's GitHub app
# must be installed on the repo. A page opts out with `comments: false`.
comments:
  giscus:
    repo: apurvanakade/Monte-Carlo-Methods
    repo-id: R_kgDOPX0lZg
    category: General
    category-id: DIC_kwDOPX0lZs4DIeN8
    mapping: pathname
    reactions-enabled: false
    input-position: bottom

# mathviz (https://github.com/apurvanakade/mathviz): puts math.js, Plotly,
# window.VM and the mathviz stylesheet into every page's <head>.
filters:
  - mathviz
mathviz:
  referrer: same-origin
  # The sidebar is off-canvas behind a slim rail (open, pin). pin-key is the
  # localStorage key the pin is kept under, so readers' pins survive. It
  # starts closed at every width until the reader pins it: the right margin
  # holds the table of contents, and a docked sidebar as well crowds a
  # laptop screen.
  sidebar-rail:
    pin-key: mcm-sidebar-pinned
    default: closed
  # A title search box at the top of the sidebar.
  sidebar-search: true
  # Inter + JetBrains Mono from site_libs/ (the theme below names them).
  fonts: true
  # The table of contents drawn quietly: no heading or rule, small soft
  # text, faded until hovered or focused, at the middle of the window's
  # height (see format.html.toc below).
  quiet-toc: true
  # A "Share" button on every app (each <div class="vm-app">) with the page
  # link and an <iframe> snippet. Turns on embed mode too: any app page
  # loaded with ?embed=1 shows the app alone, for a frame.
  share:
    site-url: https://apurvanakade.github.io/Monte-Carlo-Methods

format:
  html:
    # mathviz's Quarto theme: Bootstrap chrome in the same palette as the
    # mathviz panels. Site overrides would go in a second file listed after
    # each (set $vm-* variables under /*-- scss:defaults --*/).
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss]
    # A table of contents in the right margin of every page, drawn quietly
    # (mathviz's quiet-toc, above). It lists the top-level sections; a section's
    # subsections show only while the reader is in it (toc-depth: 3 with
    # Quarto's default toc-expand; toc-depth: 2 drops them altogether). The
    # introduction pages turn it off (`toc: false` in their front matter).
    toc: true
    toc-depth: 3
    # Unnumbered sections. Link to a section by its title: [Title](#sec-id).
    number-sections: false
    # Callouts are drawn without icons (_chrome/callouts.css styles them).
    callout-icon: false
    # Body column width on wide screens (the sidebar rail centres it); the
    # Quarto default is 800px. 680px (40rem at the theme's 17px root) is about
    # 70 characters of text, and prose, apps and figures share it.
    grid:
      body-width: 680px
    # Exercises: textbook-style #exr- blocks, with "Next exercise" buttons
    # from the script in _chrome/exercises.html.
    # Callouts and the title block: quiet, like the blog's.
    css:
      - _chrome/exercises.css
      - _chrome/callouts.css
      - _chrome/title-block.css
    include-after-body:
      - _chrome/exercises.html
    include-in-header:
      # No comment thread in mathviz embed mode (?embed=), which shows the
      # app alone. Drop this once mathviz's chrome/embed.css lists .giscus.
      - text: "<style>html.vm-embed .giscus { display: none !important; }</style>"

# Every code cell is OJS, run in the reader's browser; nothing executes at
# render time.
execute:
  echo: false
  warning: false
