project:
  type: website
  output-dir: docs
  # Only the pages: keeps CLAUDE.md and README.md out of the site.
  render:
    - "*.qmd"
    - "**/*.qmd"
  # Pulls the latest mathviz release into _extensions/ before every build.
  pre-render: scripts/update-mathviz.sh

website:
  title: "Monte Carlo Methods Lecture Notes"
  site-url: https://apurvanakade.github.io/Monte-Carlo-Methods
  open-graph: true
  page-navigation: true
  bread-crumbs: false
  navbar:
    search: true
    right:
      - icon: github
        href: https://github.com/apurvanakade/Monte-Carlo-Methods
        aria-label: GitHub
  # Hand-written. Every page is <slug>/index.qmd; the draft pages (mmn,
  # kalman-filters, optimization, simulated-annealing, cross-entropy) are
  # left out until they are ready.
  sidebar:
    style: floating
    contents:
      - text: Preface
        href: index.qmd
      - intro/index.qmd
      - section: Estimation
        href: estimation/index.qmd
        contents:
          - estimating-pi/index.qmd
          - integrals/index.qmd
      - section: Sampling
        href: sampling/index.qmd
        contents:
          - rng/index.qmd
          - discrete/index.qmd
          - inverse-transform/index.qmd
          - other-distributions/index.qmd
          - accept-reject/index.qmd
          - gibbs-2d/index.qmd
          - mh/index.qmd
      - variance-reduction/index.qmd
      - section: Applications
        contents:
          - sde/index.qmd
          - ising/index.qmd
          - bootstrap/index.qmd
      - section: Advanced Topics
        contents:
          - particle-filters/index.qmd
      - section: Appendices
        contents:
          - probability/index.qmd
          - markov-chains/index.qmd
  page-footer: "© 2026 Apurva Nakade"

bibliography: references.bib

# A comment thread under every page (https://giscus.app): each page's thread
# is a GitHub Discussion in this repo's "General" category, keyed by the
# page's path. The ids are from the repo's GraphQL API; giscus's GitHub app
# must be installed on the repo. A page opts out with `comments: false`.
comments:
  giscus:
    repo: apurvanakade/Monte-Carlo-Methods
    repo-id: R_kgDOPX0lZg
    category: General
    category-id: DIC_kwDOPX0lZs4DIeN8
    mapping: pathname
    reactions-enabled: false
    input-position: bottom

# mathviz (https://github.com/apurvanakade/mathviz): puts math.js, Plotly,
# window.VM and the mathviz stylesheet into every page's <head>.
filters:
  - mathviz
mathviz:
  referrer: same-origin
  # The sidebar is off-canvas behind a slim rail (open, pin); the string is
  # the localStorage key the pin is kept under, so readers' pins survive.
  sidebar-rail: mcm-sidebar-pinned
  # A title search box at the top of the sidebar.
  sidebar-search: true
  # Inter + JetBrains Mono from site_libs/ (the theme below names them).
  fonts: true
  # Select text -> "Report bug" opens an issue linking the page's .qmd source.
  report-bug:
    repo: apurvanakade/Monte-Carlo-Methods
  # A "Share" button on every app (each <div class="vm-app">) with the page
  # link and an <iframe> snippet. Turns on embed mode too: any app page
  # loaded with ?embed=1 shows the app alone, for a frame.
  share:
    site-url: https://apurvanakade.github.io/Monte-Carlo-Methods

format:
  html:
    # mathviz's Quarto theme: Bootstrap chrome in the same palette as the
    # mathviz panels. Site overrides would go in a second file listed after
    # each (set $vm-* variables under /*-- scss:defaults --*/).
    theme:
      light: [_extensions/apurvanakade/mathviz/theme/mathviz-light.scss]
      dark: [_extensions/apurvanakade/mathviz/theme/mathviz-dark.scss]
    # No per-page table of contents: the page is one column, like the blog.
    toc: false
    # Unnumbered sections: with no table of contents nothing refers to them
    # by number. Link to a section by its title: [Title](#sec-id).
    number-sections: false
    # Callouts are drawn without icons (_chrome/callouts.css styles them).
    callout-icon: false
    # Body column width on wide screens (the sidebar rail centres it); the
    # Quarto default is 800px. Prose is capped at 40rem (680px) inside it and
    # centred, so apps and figures stand out by the same margin on each side.
    grid:
      body-width: 680px
    # Prose measure: caps paragraphs and headings at 40rem inside the column.
    # Exercises: textbook-style #exr- blocks, with "Next exercise" buttons
    # from the script in _chrome/exercises.html.
    # Callouts and the title block: quiet, like the blog's.
    css:
      - _chrome/reading-measure.css
      - _chrome/exercises.css
      - _chrome/callouts.css
      - _chrome/title-block.css
    include-after-body:
      - _chrome/exercises.html
    include-in-header:
      # No comment thread in mathviz embed mode (?embed=), which shows the
      # app alone. Drop this once mathviz's chrome/embed.css lists .giscus.
      - text: "<style>html.vm-embed .giscus { display: none !important; }</style>"

# Every code cell is OJS, run in the reader's browser; nothing executes at
# render time.
execute:
  echo: false
  warning: false
