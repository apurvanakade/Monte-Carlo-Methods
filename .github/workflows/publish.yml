# Renders the book on every push to main (a release: `make release`
# fast-forwards main to develop) and publishes docs/ to the gh-pages branch,
# which GitHub Pages serves directly (Pages source: gh-pages, /), deployed by
# GitHub's own pages-build-deployment. There is deliberately no deploy.yml
# triggered by the gh-pages push: a push made with GITHUB_TOKEN never triggers
# another workflow. gh-pages is force-orphaned each time, so it holds only the
# current build rather than a history of them.

name: Render and publish to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Render the book
        uses: ./.github/actions/render

      - name: Publish docs/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
