# Renders the whole book on every pull request to develop, so a red check
# means a chapter's method tests fail (`npm test`) or some chapter no longer builds. It can't see an OJS cell that throws in
# the browser -- that is checked in a preview before the PR. The rendered site is attached to the run as the
# `site` artifact, for a reviewer to download and open.

name: Verify pull request

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Test the methods
        run: npm test

      - name: Render the site
        uses: ./.github/actions/render

      - name: Attach the rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/
          retention-days: 7
