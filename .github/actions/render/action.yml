# Renders the book into docs/, the same way `make build` does locally; the
# pre-render hook pulls the latest mathviz release. Shared by pr-check.yml and
# publish.yml so the two renders can't drift apart. Every code cell is OJS and
# runs in the reader's browser, so nothing needs installing but Quarto.

name: Render the book
description: Install Quarto, quarto render

runs:
  using: composite
  steps:
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: 1.10.18

    - name: Render
      shell: bash
      run: quarto render
